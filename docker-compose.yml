version: '3.8'

services:
  backend:
    build: ./backend
    container_name: norrin_backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend/export:/app/export
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: norrin_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
